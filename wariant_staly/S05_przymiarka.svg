<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>Makieta S05: widok z góry na przyłącze obok prawego boku</title>
<style>text{font-family:sans-serif;font-size:4px;fill:#162636}.title{font-size:7px;font-weight:bold}.edge{fill:none;stroke:#142e43;stroke-width:.5}.axis{stroke:#436175;stroke-width:.35;stroke-dasharray:3 2}</style>
<rect width="420" height="297" fill="white"/>
<text x="12" y="18" class="title">S05. Przymiarka przyłącza bocznego 1:1</text>
<text x="12" y="29">A3 poziomo, druk 100%. Widok z góry. Poglądowe obwiednie do makiety; brak konturów do frezowania.</text>
<text x="12" y="39">Głębokość rośnie w prawo, od płaszczyzny frontu do tyłu. Występ od prawego boku rośnie ku górze kartki.</text>
<g transform="translate(12 180)">
<rect x="0" y="0" width="394" height="22" fill="#dfcda7" stroke="#142e43" stroke-width=".5"/>
<text x="5" y="14">Prawy bok korpusu, MDF 22 mm</text>
<rect x="270" y="-70" width="80" height="70" fill="#d1e6e9" stroke="#142e43" stroke-width=".5"/>
<text x="281" y="-49">Osłona 80 × 70 mm</text>
<rect x="260" y="-60.4" width="10" height="50.8" fill="#9cb8c3" stroke="#142e43" stroke-width=".4"/>
<rect x="177.5" y="-48.4" width="82.5" height="26.8" fill="#dce1ed" stroke="#142e43" stroke-width=".4"/>
<text x="186" y="-35">Obwiednia wtyku</text>
<path d="M167.5 -35h10" fill="none" stroke="#45775c" stroke-width="7.8"/>
<path d="M132.5 -35h35" class="axis"/>
<path d="M132.5 -44v18 M270 -76v6 M350 -76v6" class="edge"/>
<text x="108" y="-49">Granica próby wypięcia</text>
<text x="252" y="-79">270 mm</text><text x="341" y="-79">350 mm</text>
<text x="0" y="30">0 / front</text><text x="365" y="30">394 mm / tył</text>
</g>
<text x="12" y="230">Wysokość osłony prostopadle do rysunku: 72 mm. Oś wtyku: 35 mm od boku. Pozycję zatrzasku sprawdzić na części.</text>
<text x="12" y="240">Łuk przewodu biegnie równolegle do boku, poza płaszczyzną rysunku. Na makiecie dodać przewód, dłoń i ruch wypinania.</text>
<path d="M12 261h100 M12 258v6 M112 258v6" class="edge"/>
<text x="12" y="273">Odcinek kontrolny 100 mm. Zmierzyć po wydruku.</text>
</svg>
