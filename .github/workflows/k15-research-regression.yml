name: K15 research 3D assembly, 138 blanks and PNG validation
on:
  pull_request:
    paths:
      - "skrypty/k15_*"
      - "wyniki/k15_*"
      - "dokumentacja/K15_*"
      - "raporty/K15_*"
      - "README.md"
      - ".github/workflows/k15-research-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deterministic generator and original P30E checks
        run: |
          set -euo pipefail
          node --check skrypty/k15_pre_cnc_model.js
          node --check skrypty/k15_pogladowy_rysunek.js
          cp wyniki/k15_p30e_przed_CNC_zestawienie.json /tmp/k15-original.json
          cp wyniki/k15_p30e_przed_CNC_138_elementow.csv /tmp/k15-original.csv
          cp dokumentacja/K15_p30e_zlozenie_parametryczne_NIE_CNC.scad /tmp/k15-original.scad
          cp wyniki/k15_widoki_obudowy_i_wkladow_NIE_CNC.svg /tmp/k15-original.svg
          node skrypty/k15_pre_cnc_model.js
          node skrypty/k15_pogladowy_rysunek.js
          cmp /tmp/k15-original.json wyniki/k15_p30e_przed_CNC_zestawienie.json
          cmp /tmp/k15-original.csv wyniki/k15_p30e_przed_CNC_138_elementow.csv
          cmp /tmp/k15-original.scad dokumentacja/K15_p30e_zlozenie_parametryczne_NIE_CNC.scad
          cmp /tmp/k15-original.svg wyniki/k15_widoki_obudowy_i_wkladow_NIE_CNC.svg
          node - <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const {generateK15}=require('./skrypty/k15_pre_cnc_model.js');
          const a=generateK15().assembly;
          assert.deepEqual(a.quantities,{structural_shell:7,braces:11,modular_box_panels:120,all_reference_blanks:138,modules:20});
          assert.deepEqual(a.inside_mm,[976,359,456]);
          assert.equal(a.parts.length,138);
          assert.equal(new Set(a.parts.map(p=>p.id)).size,138);
          assert.equal(a.parts.filter(p=>p.type==='front').length,2);
          assert.equal(a.parts.filter(p=>p.type==='brace').length,11);
          assert.equal(a.module_positions.length,20);
          assert.deepEqual(a.reference_module_count_by_size,{small:4,rear:8,front:8});
          assert.equal(a.solid_AABB_clashes_in_provisional_nominal_box_elements.length,0);
          assert.equal(a.nominal_cavity_enclosure_shell_l,52.600134);
          assert.equal(a.nominal_11_braces_l,1.60908);
          assert.equal(a.reference_net_l_P30E_no_new_pads['100'],100.119294);
          assert.equal(a.reference_net_l_P30E_no_new_pads['120'],119.919294);
          assert.equal(a.reference_net_l_P30E_no_new_pads['150'],150.159294);
          assert.equal(a.front_MDF_mounting_holes_have_NOT_been_defined,true);
          assert.equal(a.reference_visible_driver_basket_metal_hole_d_mm,6.5);
          assert.equal(a.example_M5_MDF_through_hole_mm_ONLY_NONAPPROVED,5.5);
          assert.equal(a.parts.every(p=>p.manufacturing_status==='REFERENCE_ONLY_NOT_CNC'),true);
          const scad=fs.readFileSync('dokumentacja/K15_p30e_zlozenie_parametryczne_NIE_CNC.scad','utf8');
          assert(scad.includes('FRONT MDF screw holes NOT MODELLED'));
          assert(scad.includes('Basket factory holes Ø6.5 are marker positions only'));
          assert(scad.includes('sphere(d=4)'));
          assert(!scad.includes('cylinder(d=6.5,h=48'));
          const csv=fs.readFileSync('wyniki/k15_p30e_przed_CNC_138_elementow.csv','utf8');
          assert.equal(csv.trim().split('\n').length,139);
          console.log('K15 PASS: volume, 138 numbered references, 0 AABB overlap, NO MDF screw holes');
          NODE
      - name: Verify PNG/SVG pair, report and that previous README order is unchanged
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import subprocess
          readme=Path('README.md').read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show','f89b7f91f416a9150491baf91cf97a36b54f51b8:README.md'],text=True)
          # Authorized 2026-11-04 editorial reorder: selection of Dayton before cabinet,
          # supplementary two-STX comparison after it. All technical archives stay unchanged.
          tail='## Krótki słownik do wykresów'
          assert readme[readme.index(tail):]==base[base.index(tail):], 'Technical archive must remain byte-identical'
          assert readme.index('### Jak spośród 40 kandydatów')<readme.index('## Praktyczny przewodnik')
          assert readme.index('## Praktyczny przewodnik')<readme.index('## Konstrukcja obudowy')
          assert readme.index('## Konstrukcja obudowy')<readme.index('## Badania uzupełniające')
          assert readme.index('## Badania uzupełniające')<readme.index('### B12-01')
          assert readme.count('### A20. K15')==1
          assert readme.index('### A20. K15')>readme.index('### A19. K14')
          svg=Path('wyniki/k15_widoki_obudowy_i_wkladow_NIE_CNC.svg')
          png=svg.with_suffix('.png')
          assert svg.exists() and png.exists(), 'every new SVG requires a real PNG pair'
          assert 'CNC HOLD' in svg.read_text(encoding='utf8')
          with Image.open(png) as im:
              assert im.format=='PNG' and im.size[0]==1000 and im.size[1]>=450
          assert 'wyniki/k15_widoki_obudowy_i_wkladow_NIE_CNC.png' in readme
          report=Path('raporty/K15_parametryczne_zlozenie_i_zestawienie_przed_CNC.md').read_text(encoding='utf8')
          assert '138' in report and 'CNC HOLD' in report
          print('K15 PASS: preserved technical archive, ordered Dayton → construction → STX, PNG/SVG and no CNC release')
          PY
