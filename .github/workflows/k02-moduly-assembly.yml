name: K02 - verify P30E module ingress past K01 pads
on:
  pull_request:
    paths:
      - "skrypty/k02_dostep_modulow_i_klocki.py"
      - "raporty/K02_*"
      - "README.md"
      - ".github/workflows/k02-moduly-assembly.yml"
  push:
    branches: [main]
    paths:
      - "skrypty/k02_dostep_modulow_i_klocki.py"
      - "README.md"
      - ".github/workflows/k02-moduly-assembly.yml"
jobs:
  physical_path_surrogate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy used by existing P30A/P30E construction model
        run: python3 -m pip install "numpy>=1.26,<3"
      - name: Reproduce complete 100, 120 and 150 liter assembly sequences
        run: python3 skrypty/k02_dostep_modulow_i_klocki.py
      - name: Inspect full numerical summary and invariants
        run: |
          python3 - <<'PY'
          import json
          v=json.load(open("wyniki/k02_moduly_manifest_odtworzony.json",encoding="utf8"))
          x=v["summary"]
          assert x["assembly_sequences"]==14
          assert x["successful_20mm_sequences"]==7
          assert x["cases_by_state_clearance"]["20mmPad_100L_3mm"]["complete"]==20
          assert x["cases_by_state_clearance"]["20mmPad_100L_6mm"]["complete"]==20
          assert x["cases_by_state_clearance"]["20mmPad_120L_3mm"]["complete"]==12
          assert x["cases_by_state_clearance"]["20mmPad_150L_6mm"]["complete"]==1
          assert x["cases_by_state_clearance"]["30mmPad_100L_3mm"]["complete"]==16
          assert x["cases_by_state_clearance"]["30mmPad_120L_3mm"]["complete"]==12
          assert x["failed_30mm_sequences"]>=1
          assert all(row["min_aperture_margin_mm"]>0 for row in x["cases_by_state_clearance"].values())
          print("K02: 20-mm pads pass all 7 scenarios; 30-mm pads fail one assembly state")
          PY
      - name: Publish full paths and collision diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k02-full-sequence-modules-with-eight-pads
          path: |
            wyniki/k02_moduly_przejscia_pelne.json
            wyniki/k02_moduly_manifest_odtworzony.json
          retention-days: 14
