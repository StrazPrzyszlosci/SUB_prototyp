name: K36 bank datums and front access
on:
  workflow_dispatch:
  pull_request:
    paths: ['skrypty/k36*', 'skrypty/sprawdz_k36.py', 'skrypty/k35*', 'wyniki/k30*', 'wyniki/k32*', 'wyniki/k33*']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ezdxf matplotlib
      - run: python skrypty/k36_bank_z_pomiarow.py
      - run: python skrypty/sprawdz_k36.py
