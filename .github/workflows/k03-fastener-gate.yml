name: K03 - fastener radial web and construction guide gate
on:
  pull_request:
    paths:
      - "skrypty/k03_budzet_lacznika_i_sciezka_sily.py"
      - "wyniki/k03_*"
      - "raporty/K03_*"
      - "README.md"
      - ".github/workflows/k03-fastener-gate.yml"
  push:
    branches: [main]
    paths:
      - "skrypty/k03_budzet_lacznika_i_sciezka_sily.py"
      - "wyniki/k03_*"
      - "README.md"
      - ".github/workflows/k03-fastener-gate.yml"
jobs:
  geometrical-decision-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce 162 conditional fastening geometries
        run: python3 skrypty/k03_budzet_lacznika_i_sciezka_sily.py > /tmp/k03-summary.log
      - name: Independent formula and README guide-vs-appendix audit
        run: |
          python3 - <<'PY'
          import itertools,json
          r=json.load(open('wyniki/k03_podsumowanie.json',encoding='utf8'))
          g=json.load(open('wyniki/k03_manifest_odtworzony.json',encoding='utf8'))['summary']
          assert g['radial_sensitivity_cases']==r['engineering_screen']['total']==162
          assert g['geometry_pass_counts_by_d']==r['engineering_screen']['passes_by_external_d_mm']
          C=368/2-355.8/2
          assert abs(C-6.1)<1e-12
          ref={str(float(d)):sum(C-g-.5*d-t>=w-1e-9
                for g,w,t in itertools.product((.5,1.,2.),(1.,2.,3.),(0.,.5,1.)))
                for d in (5.,5.5,6.,6.5,8.,10.)}
          assert ref==g['geometry_pass_counts_by_d']
          assert abs(2*(6.1-1-.5-2)-5.2)<1e-10
          assert g['benchmark_hypothesis']['max_external_diameter_that_passes_mm']==5.2
          assert g['benchmark_hypothesis']['d8_result_wood_web_mm']==.6
          assert abs(184-178.9-8/2-1.1)<1e-10
          assert r['engineering_screen']['K02_wood_web_at_d8_nominal_mm']==1.1
          s=open('README.md',encoding='utf8').read()
          gpos=s.index('### 4a. Jak przejść od kosza do rzeczywistego mocowania?')
          nxt=s.index('### 5. Co oznaczają wykresy DSP i temperatury?')
          annex=s.index('## Aneks techniczny')
          assert gpos<nxt<annex
          assert nxt-gpos<2600
          assert s.index('### A11. K03')>annex
          assert 'K03' in s[gpos:nxt] and '6,1 mm' in s[gpos:nxt]
          print('K03 PASS: source radial geometry, 162 cases, independent bounds, guide integrity')
          PY
      - name: Archive generated research matrix (not physical measurements)
        uses: actions/upload-artifact@v4
        with:
          name: k03-radial-fastener-162-conditional-cases
          path: |
            wyniki/k03_pelna_macierz_przeswitow.json
            wyniki/k03_manifest_odtworzony.json
          retention-days: 14
