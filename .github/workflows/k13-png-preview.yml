name: K13 render accompanying PNG preview from own SVG
on:
  push:
    branches:
      - research/k13-captive-m5-plate-in-20mm-pad-20261104
    paths:
      - "wyniki/k13_plytka_M5_w_klocku20_NIE_CNC.svg"
      - "skrypty/render_svg_png.py"
      - ".github/workflows/k13-png-preview.yml"
permissions:
  contents: write
jobs:
  png-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render PNG from the exact authored SVG
        run: |
          python -m pip install --disable-pip-version-check --quiet cairosvg pillow
          python skrypty/render_svg_png.py \
            wyniki/k13_plytka_M5_w_klocku20_NIE_CNC.svg \
            wyniki/k13_plytka_M5_w_klocku20_NIE_CNC.png \
            --width 1000 --colors 64
      - name: Attach the binary PNG to the same research branch through GitHub Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          API: ${{ github.api_url }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json,os,urllib.request,urllib.error
          path="wyniki/k13_plytka_M5_w_klocku20_NIE_CNC.png"
          payload=Path(path).read_bytes()
          assert payload[:8]==b"\x89PNG\r\n\x1a\n"
          url=f'{os.environ["API"]}/repos/{os.environ["REPO"]}/contents/{path}'
          headers={"Accept":"application/vnd.github+json",
                   "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "X-GitHub-Api-Version":"2022-11-28"}
          sha=None
          get=urllib.request.Request(url+"?ref="+os.environ["GH_BRANCH"],headers=headers)
          try:
              with urllib.request.urlopen(get,timeout=20) as resp:
                  old=json.load(resp)
                  sha=old.get("sha")
                  if base64.b64decode(old.get("content",""))==payload:
                      print("PNG unchanged; skip commit")
                      raise SystemExit(0)
          except urllib.error.HTTPError as exc:
              if exc.code!=404: raise
          body={"message":"K13: add faithful PNG preview alongside source SVG (generated, NOT CNC)",
                "content":base64.b64encode(payload).decode("ascii"),
                "branch":os.environ["GH_BRANCH"]}
          if sha:body["sha"]=sha
          req=urllib.request.Request(url,json.dumps(body).encode("utf-8"),
                 headers={**headers,"Content-Type":"application/json"},method="PUT")
          with urllib.request.urlopen(req,timeout=25) as resp:
              res=json.load(resp)
              print("Committed PNG, blob",res["content"]["sha"],"commit",res["commit"]["sha"])
          PY
