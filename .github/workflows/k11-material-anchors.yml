name: K11 real insert envelope and material substitution regression
on:
  pull_request:
    paths:
      - "dane/k11_źródłowe_wkładki_i_warianty_skrzyni.json"
      - "dane/k10_rejestr_materialow_czesci_obudowy.json"
      - "skrypty/k11_realne_wkladki_i_materialy_nosne.py"
      - "wyniki/k11_przesiew_materialow_i_wkladek.json"
      - "raporty/K11_realne_wkladki_pasy_drewna_i_materialy_scian.md"
      - "README.md"
      - ".github/workflows/k11-material-anchors.yml"
  workflow_dispatch:
jobs:
  k11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recompute all K11 material and hardware geometry from versioned inputs
        shell: bash
        run: |
          set -euo pipefail
          cp wyniki/k11_przesiew_materialow_i_wkladek.json /tmp/k11-reviewed.json
          python skrypty/k11_realne_wkladki_i_materialy_nosne.py
          python - <<'PY'
          import json,sys
          from pathlib import Path
          reviewed=json.loads(Path("/tmp/k11-reviewed.json").read_text(encoding="utf-8"))
          actual=json.loads(Path("wyniki/k11_przesiew_materialow_i_wkladek.json").read_text(encoding="utf-8"))
          assert reviewed==actual,"K11 source-derived results diverge from reviewed JSON"
          assert len(actual["insert_screener"]["catalog_examples"])==6
          assert len(actual["pad_variants"])==5
          assert [x["nominal_front_wood_ligament_to_cutout_mm"] for x in actual["insert_screener"]["wood_clearance_for_screw_examples"]]==[3.85,3.35,2.8]
          assert [x["hardwood_reference_predrill_mm"] for x in actual["insert_screener"]["catalog_examples"][:4]]==[7,8,10,10]
          assert [x["predrill_diameter_mm"] for x in actual["insert_screener"]["catalog_examples"][:4]]==[6.5,9,10,10]
          assert all("front_cutout_radial_ligament_mm" not in x for x in actual["insert_screener"]["catalog_examples"])
          assert all(x["manufacturer_basket_d_mm"]==6.5 for x in actual["insert_screener"]["wood_clearance_for_screw_examples"])
          assert len(actual["wall_substitution_with_outer_size_fixed"]["scenarios"])==3
          assert actual["insert_screener"]["max_outer_insert_diameter_for_2mm_inner_pad_ligament_mm"]==6.2
          i=actual["insert_screener"]["catalog_examples"]
          assert [c["pad_radial_inner_ligament_mm"] for c in i[:3]]==[1.1,0.1,-0.9]
          assert all(not p["geometry_screen_both_ligaments_at_least_2mm"] for p in i)
          assert all(not p["is_pullout_strength_qualified"] for p in i)
          walls=actual["wall_substitution_with_outer_size_fixed"]["scenarios"]
          assert [x["gross_cavity_delta_vs_MDF22_l"] for x in walls]==[0,-4.381104,1.477536]
          assert actual["wall_substitution_with_outer_size_fixed"]["gross_change_is_not_net_change"]
          assert len(actual["K10_covered_roles"])==13
          assert "CNC HOLD" in actual["status"]
          sys.path.insert(0,str(Path("skrypty").resolve()))
          import k01_mocowanie_bilans as k01
          witness=k01.evaluate(231,178.9,205,36,20,2)
          assert witness["pass_surrogate"] and witness["hole_footprint_clearance_mm"]==1.0
          print("K11 PASS: checked against K01 pad, six actual catalogue OD dimensions and isolated wall volume changes")
          PY
      - name: Verify practical guide, K10 continuity, original figure and explicit qualification limits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          readme=Path("README.md").read_text(encoding="utf-8")
          assert "### A17. K11" in readme
          headings=["### 1. Wybór przetwornika","### 2. Badania akustyczne","### 3. Badania materiałów","### 4. Dopiero po projekcie","### 4a. Jak przejść","### 5. Co oznaczają"]
          positions=[readme.index(h) for h in headings]
          assert positions==sorted(positions), "Przewodnik ma prowadzić od głośnika i obudowy do mocowania"
          assert "Ø5,5 mm we froncie" in readme and "Ø9 mm w MDF" in readme and "Ø8 mm w drewnie twardym" in readme
          assert "Fabryczne **Ø6,5 mm**" in readme
          assert readme.index("### A17. K11")>readme.index("### A16. K10")
          assert "(raporty/K11_realne_wkladki_pasy_drewna_i_materialy_scian.md)" in readme[:readme.index("## Aneks techniczny — inspiracje montażowe")]
          a=readme.index("### 4a. Jak przejść")
          b=readme.index("### 5. Co oznaczają",a)
          assert b-a<2000, "Practical guide now too long"
          assert "wyniki/k11_rzeczywiste_wkladki_w_klocku_NIE_CNC.svg" in readme
          assert Path("wyniki/k11_rzeczywiste_wkladki_w_klocku_NIE_CNC.svg").exists()
          old=json.loads(Path("dane/k10_rejestr_materialow_czesci_obudowy.json").read_text(encoding="utf-8"))
          assert len(old["parts"])==35
          assert all(p["material_status"]=="CANDIDATE_NOT_QUALIFIED" for p in old["parts"])
          assert "K11" in next(p for p in old["parts"] if p["id"]=="E10")["quantitative_evidence"]
          assert "CNC HOLD" in readme
          print("K11 PASS: front handbook remains short, all parts unqualified, K11 appended to A17")
          PY
