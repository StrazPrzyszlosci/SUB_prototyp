name: K35 measured shell and frames
on:
  workflow_dispatch:
  pull_request:
    paths: ['skrypty/k35*', 'skrypty/sprawdz_k35.py', 'dane/k35*', 'wyniki/k30_czesci.json']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python skrypty/k35_korpus_z_pomiarow.py
      - run: python skrypty/sprawdz_k35.py
