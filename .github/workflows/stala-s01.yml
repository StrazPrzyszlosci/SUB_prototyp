name: Stala obudowa S01
on:
  push:
    branches: ['badania/stala-obudowa-2-2']
    paths: ['wariant_staly/**', '.github/workflows/stala-s01.yml']
permissions:
  contents: read
jobs:
  porownanie:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy matplotlib
      - run: python wariant_staly/sprawdz_s01.py
      - run: python wariant_staly/s01.py
      - run: python wariant_staly/sprawdz_s01.py
      - name: Regresja korpusu S02
        run: |
          cp wariant_staly/s02_wyniki.json "$RUNNER_TEMP/s02.json"
          python wariant_staly/s02.py
          python wariant_staly/sprawdz_s02.py "$RUNNER_TEMP/s02.json"
      - name: Regresja płyty i pierścienia S03
        run: |
          cp wariant_staly/s03_wyniki.json "$RUNNER_TEMP/s03.json"
          python wariant_staly/s03.py
          PYTHONPATH=wariant_staly python -c "import json, os; from sprawdz_s02 import compare; compare(json.load(open('wariant_staly/s03_wyniki.json')), json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 's03.json'))))"
      - name: Regresja głębokości zabudowy S04
        run: |
          cp wariant_staly/s04_wyniki.json "$RUNNER_TEMP/s04.json"
          python wariant_staly/s04.py
          PYTHONPATH=wariant_staly python -c "import json, os; from sprawdz_s02 import compare; compare(json.load(open('wariant_staly/s04_wyniki.json')), json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 's04.json'))))"
      - name: Regresja miejsca na przyłącze S05
        run: |
          cp wariant_staly/s05_wyniki.json "$RUNNER_TEMP/s05.json"
          python wariant_staly/s05.py
          PYTHONPATH=wariant_staly python -c "import json, os; from sprawdz_s02 import compare; compare(json.load(open('wariant_staly/s05_wyniki.json')), json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 's05.json'))))"
