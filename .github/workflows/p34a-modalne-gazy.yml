name: P34A - acoustic cavity modal regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  cavity-mode-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Rerun 90 modes
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python skrypty/p34a_modalny_gaz_3d.py --out /tmp/p34a_results.json
      - name: Check truncation stability and geometry tags
        run: |
          python - <<'PY'
          import json
          z=json.load(open('/tmp/p34a_results.json'))
          assert z['cases']==90
          def v(vol,f,n):
              return next(x for x in z['records'] if x['volume_l']==vol and x['f_hz']==f and x['modes_per_axis']==n)
          for vol in (100,120,150):
              a,b=v(vol,80,10),v(vol,80,12)
              assert abs(a['max_amplitude_departure_pct']-b['max_amplitude_departure_pct'])<1.2
              assert a['max_amplitude_departure_pct']>0
          assert 10<v(120,80,10)['rms_amplitude_departure_pct']<13
          print('PASS P34A 90 model cases')
          PY
