<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 610" role="img" aria-label="K04: pad radius and standard M6 nut and washer footprint plus axial assembly stack, hypothetical construction validation only">
<rect width="1160" height="610" fill="#f8fbfc"/>
<text x="28" y="38" font-family="sans-serif" font-size="24" font-weight="700" fill="#203a4d">K04 — nakrętka i podkładka: gdzie naprawdę brakuje miejsca?</text>
<text x="28" y="64" font-family="sans-serif" font-size="13" fill="#587485">Wymiary Daytona i nominalne rozmiary M6. To szkic pomiarowy do prób, nie detal produkcyjny.</text>
<rect x="25" y="88" width="765" height="445" rx="12" fill="#fff" stroke="#d4e0e8"/>
<text x="47" y="118" font-family="sans-serif" font-size="17" font-weight="700" fill="#233a49">Rzut promieniowy — poziomy przekrój przy jednej śrubie</text>
<rect x="95.0" y="171" width="600.3" height="118" fill="#dec6a5" stroke="#af916a"/>
<rect x="74.3" y="199" width="552.0" height="30" fill="#6686a3" stroke="#365c78"/>
<line x1="72" x2="72" y1="150" y2="315" stroke="#c4554e" stroke-width="3" stroke-dasharray="5 5"/>
<line x1="212.30" x2="212.30" y1="146" y2="313" stroke="#243e52" stroke-width="2" stroke-dasharray="4 5"/>
<rect x="79.51" y="237" width="265.58" height="30" fill="#4b8a78" fill-opacity=".85" stroke="#226d5a"/>
<rect x="74.30" y="270" width="276.00" height="17" fill="#b57960" fill-opacity=".87" stroke="#84553f"/>
<text x="44" y="347" font-family="sans-serif" font-size="14" fill="#344d5c">Czerwona linia: krawędź wycięcia R177,9</text>
<text x="164.3" y="157" font-family="sans-serif" font-size="14" fill="#344d5c">Śruba R184</text>
<text x="44" y="377" font-family="sans-serif" font-size="14" fill="#344d5c">Drewno zaczyna się od R178,9, płytka modelowa od R178,0.</text>
<text x="44" y="406" font-family="sans-serif" font-size="14" fill="#344d5c">Idealny M6 (AF10): narożnik sięga do R178,23.</text>
<text x="44" y="435" font-family="sans-serif" font-size="14" fill="#344d5c">Podkładka ISO 7089 Ø12: wewnętrzny zasięg R178,0.</text>
<text x="44" y="472" font-family="sans-serif" font-size="14" fill="#a0563e" font-weight="700">Pozostaje zaledwie 0,1 mm od nominalnego wycięcia!</text>
<text x="44" y="506" font-family="sans-serif" font-size="12" fill="#6f8591">Wartości bez odchyłek kosza i narzędzia. Płytka nie ma zweryfikowanej nośności ani dostępu.</text>
<rect x="808" y="88" width="324" height="445" rx="12" fill="#fff" stroke="#d4e0e8"/>
<text x="830" y="118" font-family="sans-serif" font-size="17" font-weight="700" fill="#233a49">Głębokość za frontem</text>
<text x="830" y="145" font-family="sans-serif" font-size="13" fill="#546f80">Hipotetyczna śruba M6 + płytka</text>
<rect x="837" y="177" width="52" height="218" fill="#dec6a5" stroke="#af916a"/>
<rect x="837" y="395" width="52" height="22" fill="#6686a3"/>
<rect x="837" y="417" width="52" height="18" fill="#b57960"/>
<rect x="837" y="435" width="52" height="57" fill="#4b8a78"/>
<text x="910" y="286" font-family="sans-serif" font-size="14" fill="#304b5b">Klocek 20 mm</text>
<text x="910" y="411" font-family="sans-serif" font-size="13" fill="#304b5b">Płytka 2 mm</text>
<text x="910" y="434" font-family="sans-serif" font-size="13" fill="#304b5b">Podkł. 1,6 mm</text>
<text x="910" y="462" font-family="sans-serif" font-size="13" fill="#304b5b">Nakrętka 5,2 mm</text>
<text x="910" y="499" font-family="sans-serif" font-size="14" font-weight="700" fill="#a0563e">Razem 28,8 mm</text>
<text x="28" y="567" font-family="sans-serif" font-size="13" fill="#566f7c">K02 potwierdzało przejście wkładów przy 20 mm, bez osprzętu. K04 musi je sprawdzić ponownie dla 28,8 mm.</text>
<text x="28" y="590" font-family="sans-serif" font-size="13" font-weight="700" fill="#a0563e">NIE CNC — niezmierzone: przestrzenny kosz/terminale, narzędzia, nośność MDF i płytki.</text>
</svg>
