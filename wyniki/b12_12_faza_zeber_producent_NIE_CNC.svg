<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="RSS390HF-4: four rib axes align with four out of eight hole axes; conceptual NOT CNC">
<rect width="960" height="500" fill="#f8fafc"/>
<text x="28" y="40" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1e3343">RSS390HF-4 — układ osi widoczny na rysunku producenta</text>
<text x="28" y="65" font-family="sans-serif" font-size="13" fill="#536474">4 żebra zbieżne z 4 otworami, 4 otwory między żebrami. Kąty i profile niezwymiarowane.</text>
<rect x="25" y="83" width="470" height="385" fill="white" rx="12" stroke="#d2dbe3"/>
<text x="45" y="112" font-size="14" font-family="sans-serif" fill="#1e3343">Widok kosza od tyłu — poglądowy szkic własny</text>
