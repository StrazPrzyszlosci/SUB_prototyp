<circle cx="376.8" cy="168.2" r="8" fill="#2b8a7c" stroke="white" stroke-width="2"/>
<text x="45" y="446" font-family="sans-serif" font-size="12" fill="#536474">Brąz: żebra (schemat). Czerwone: 4 otwory na osi żebra.</text>
<rect x="512" y="83" width="421" height="385" fill="white" rx="12" stroke="#d2dbe3"/>
<text x="533" y="117" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e3343">Co potwierdzono wizualnie?</text>
<circle cx="544" cy="152" r="7" fill="#bf513f"/><text x="563" y="157" font-family="sans-serif" font-size="13" fill="#253f4b">4 otwory w osiach 4 żeber</text>
<circle cx="544" cy="192" r="7" fill="#2b8a7c"/><text x="563" y="197" font-family="sans-serif" font-size="13" fill="#253f4b">4 otwory w oknach między żebrami</text>
<line x1="533" y1="222" x2="910" y2="222" stroke="#d2dbe3"/>
<text x="533" y="252" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e3343">Czego rysunek nie określa?</text>
<text x="533" y="283" font-family="sans-serif" font-size="13" fill="#253f4b">• promienia żebra za MDF44</text>
<text x="533" y="307" font-family="sans-serif" font-size="13" fill="#253f4b">• dokładnej szerokości/profilu żebra</text>
<text x="533" y="331" font-family="sans-serif" font-size="13" fill="#253f4b">• pełnego obrysu terminali i narzędzia</text>
<text x="533" y="355" font-family="sans-serif" font-size="13" fill="#253f4b">• nośności MDF, wkładek i kleju</text>
<text x="533" y="419" font-family="sans-serif" font-size="12" fill="#a34d3a">Zgodność kątowa nie oznacza kolizji 3D!</text>
<text x="27" y="492" font-family="sans-serif" font-size="12" fill="#5c6f7c">Własny schemat inspirowany rysunkiem Dayton 295-468 — nie kopia i nie CNC.</text>
