<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="650" viewBox="0 0 1060 650"><rect width="1060" height="650" fill="#fff"/>
<text x="40" y="42" font-family="Arial" font-size="27" font-weight="bold" fill="#184359">P40B — metalowy pierścień nie tworzy dodatkowego miejsca</text>
<text x="40" y="74" font-family="Arial" font-size="16" fill="#536c7b">Między wycięciem Ø355,8 a krawędzią otworu Ø6,5 na BCD Ø368 jest tylko 2,85 mm</text>
<rect x="43" y="106" width="18" height="16" fill="#438e9e"/><text x="69" y="120" font-family="Arial" font-size="15" fill="#3c5c70">Luz pierścień–wycięcie</text>
<rect x="335" y="106" width="18" height="16" fill="#dc955c"/><text x="361" y="120" font-family="Arial" font-size="15" fill="#3c5c70">Metal pierścienia do krawędzi otworu</text>
<text x="44" y="189" font-size="18" font-family="Arial" fill="#34566a">Ø356 ID</text>
 <rect x="168" y="158" width="16" height="27" rx="2" fill="#438e9e"/>
 <rect x="184" y="158" width="440" height="27" rx="2" fill="#dc955c"/>
 <text x="651" y="176" font-size="15" font-family="Arial" fill="#456172">luz 0.1 mm + metal 2.75 mm</text><text x="44" y="299" font-size="18" font-family="Arial" fill="#34566a">Ø358 ID</text>
 <rect x="168" y="268" width="176" height="27" rx="2" fill="#438e9e"/>
 <rect x="344" y="268" width="280" height="27" rx="2" fill="#dc955c"/>
 <text x="651" y="286" font-size="15" font-family="Arial" fill="#456172">luz 1.1 mm + metal 1.75 mm</text><text x="44" y="409" font-size="18" font-family="Arial" fill="#34566a">Ø360 ID</text>
 <rect x="168" y="378" width="336" height="27" rx="2" fill="#438e9e"/>
 <rect x="504" y="378" width="120" height="27" rx="2" fill="#dc955c"/>
 <text x="651" y="396" font-size="15" font-family="Arial" fill="#456172">luz 2.1 mm + metal 0.75 mm</text>
<line x1="168" y1="155" x2="168" y2="443" stroke="#a6b7bf" stroke-width="1.5"/>
<line x1="624" y1="155" x2="624" y2="443" stroke="#a6b7bf" stroke-width="1.5"/>
<text x="180" y="493" font-family="Arial" font-size="19" font-weight="bold" fill="#9c5a3b">Przykładowy warunek: 1 mm luzu + 2 mm metalu = 3 mm</text>
<text x="180" y="524" font-family="Arial" font-size="19" fill="#9c5a3b">Brakuje 0,15 mm już bez błędów wykonania.</text>
<text x="40" y="584" font-family="Arial" font-size="15" fill="#607884">675 konfiguracji tolerancji → 9 spełnia wariant 1+1 mm; 0 wariant 1+2 mm.</text>
<text x="40" y="615" font-family="Arial" font-size="14" fill="#91523c">Progi 1+1 / 1+2 są scenariuszami badawczymi, a nie normami wytrzymałościowymi.</text></svg>
