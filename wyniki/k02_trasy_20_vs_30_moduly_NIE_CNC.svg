<text x="28" y="43" font-family="sans-serif" font-size="22" font-weight="bold" fill="#193647">K02 — które wzmocnienia umożliwiają montaż wkładów?</text>
<text x="28" y="69" font-family="sans-serif" font-size="13" fill="#526b7c">Odtworzony układ P30E + 8 klocków K01. Otwór Ø355,8 mm, tylko translacje, badany luz 3–6 mm.</text>
