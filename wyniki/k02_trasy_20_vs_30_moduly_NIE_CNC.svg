<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485" role="img" aria-label="K02: porównanie dróg montażowych modułów przy lokalnych wzmocnieniach 20 i 30 mm; symulacja 3D NIE CNC">
