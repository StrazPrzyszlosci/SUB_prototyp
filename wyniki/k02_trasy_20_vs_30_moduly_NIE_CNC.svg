<text x="42" y="415" font-family="sans-serif" font-size="12" fill="#7b4b3b">Przy 30 mm pierwotna kolejność 100 l traci zweryfikowaną trasę od modułu 16; inna sekwencja nie została wykluczona.</text>
<text x="27" y="458" font-family="sans-serif" font-size="13" fill="#8e4c38">20 mm to kandydat geometryczny. Brak prawdziwego kosza 3D, śrub, wkładek, blokad i prób nośności MDF. NIE CNC.</text>
