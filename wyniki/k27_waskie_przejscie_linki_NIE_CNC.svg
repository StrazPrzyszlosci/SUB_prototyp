<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="385" viewBox="0 0 1000 385"><rect width="1000" height="385" fill="#f8fafb"/><text x="22" y="33" font-size="21" font-weight="bold" fill="#253e4b">K27 – conditional flexible cable route at guide10 · CNC HOLD</text><text x="22" y="54" font-size="13" fill="#586c7c">Conceptual cross-section, not machinable hardware or validated latch.</text><rect x="60" y="96" width="310" height="128" fill="#ccddec" stroke="#7893a9"/><text x="215" y="132" font-size="18" text-anchor="middle">Front-large box</text><text x="215" y="164" font-size="15" text-anchor="middle">Rear face Y202</text><rect x="630" y="96" width="310" height="128" fill="#c6d0da" stroke="#72808d"/><text x="790" y="132" font-size="18" text-anchor="middle">Guide10</text><text x="790" y="164" font-size="15" text-anchor="middle">Front face Y208</text><rect x="370" y="96" width="260" height="128" fill="#ddf0e5"/><rect x="413" y="128" width="173" height="62" fill="#4ba27f" rx="7"/><text x="500" y="158" font-size="17" text-anchor="middle" fill="#ffffff">4 mm envelope</text><text x="500" y="181" font-size="13" text-anchor="middle" fill="#ffffff">1 mm each side</text><text x="500" y="252" font-size="20" font-weight="bold" text-anchor="middle" fill="#2d6d54">6 mm nominal gap</text><text x="25" y="294" font-size="15" fill="#435c6c">K25's 2 mm faceplate collides with the centered cable; no latch coupling is designed.</text><text x="25" y="324" font-size="14" fill="#435c6c">4 mm envelope can traverse the empty nominal gap; 7 mm and 14 mm envelopes collide.</text><text x="25" y="363" font-size="18" font-weight="bold" fill="#a7423b">CABLE IS NOT A LOAD SUPPORT. NO CNC RELEASE.</text></svg>
