<text x="40" y="328" font-family="Arial" font-size="14" fill="#526979">Mniej µm = mniejsza amplituda, lecz nie dowodzi cichszej pełnej skrzyni.</text><text x="40" y="351" font-family="Arial" font-size="13" fill="#647887">Sztywność podpór i tłumienie hipotetyczne. Potrzebne MES całej ramy oraz pomiary.</text></svg>
