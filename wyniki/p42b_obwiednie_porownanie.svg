<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="580" viewBox="0 0 1010 580"><rect width="1010" height="580" fill="white"/><text x="35" y="42" font-family="Arial" font-size="26" font-weight="bold" fill="#1d4257">P42B — uproszczone testy obwiedni geometrycznych 3D</text><text x="35" y="72" font-family="Arial" font-size="15" fill="#586e7c">162 testy AABB dla wariantów 100/120/150 l, trzech szerokości i przesunięć</text><text x="40" y="176" font-family="Arial" font-size="19" fill="#335569">A: szeroka rama</text><rect x="260" y="152" width="510" height="38" fill="#e9edf0"/><rect x="260" y="152" width="510.00" height="38" fill="#598a8f"/><text x="794" y="178" font-family="Arial" font-size="19" fill="#385769">81 / 81</text><text x="40" y="308" font-family="Arial" font-size="19" fill="#335569">B: dwie belki</text><rect x="260" y="284" width="510" height="38" fill="#e9edf0"/><rect x="260" y="284" width="472.22" height="38" fill="#ca8952"/><text x="794" y="310" font-family="Arial" font-size="19" fill="#385769">75 / 81</text><text x="40" y="440" font-family="Arial" font-size="17" fill="#9f5b43">6 odrzuconych kombinacji belek tylko przy hipotetycznym promieniu kosza 205 mm.</text><text x="40" y="470" font-family="Arial" font-size="15" fill="#536c7b">To test obwiedni, nie kontrola rzeczywistych łączników, wiązek, uszczelnienia lub narzędzi.</text><text x="40" y="512" font-family="Arial" font-size="15" fill="#9f5b43">Brak kolizji obwiedni nie oznacza gotowości projektu CAD/CNC.</text></svg>
