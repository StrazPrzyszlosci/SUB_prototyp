<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="540" viewBox="0 0 1050 540" role="img" aria-label="B12-11: warunkowa maksymalna obwiednia kosza i odporność na tolerancje, nie CNC">
<rect width="1050" height="540" fill="#fafcfd"/>
<text x="35" y="44" font-family="sans-serif" font-weight="700" font-size="23" fill="#183044">B12-11 | Ile miejsca zostaje między koszem a wkładką?</text>
<text x="35" y="72" font-family="sans-serif" font-size="14" fill="#476175">Obliczenia warunkowe, nie pomiary kosza ani projekt do CNC</text>
<rect x="27" y="96" width="506" height="383" rx="14" fill="white" stroke="#d2dae3"/>
<text x="45" y="130" font-family="sans-serif" font-weight="700" font-size="17" fill="#183044">Największy dopuszczalny promień kosza</text>
<text x="45" y="153" font-family="sans-serif" font-size="12" fill="#476175">Przy 1 mm luzu i 2 mm pasa drewna (bez dodatkowej niepewności)</text>
<line x1="165" x2="165" y1="192" y2="391" stroke="#899cab"/>
<line x1="165" x2="470" y1="391" y2="391" stroke="#899cab"/>
<text x="167" y="419" font-family="sans-serif" font-size="12" fill="#476175">175 mm</text>
<text x="367" y="419" font-family="sans-serif" font-size="12" fill="#476175">180 mm</text>
<text x="49" y="217" font-family="sans-serif" font-size="14" fill="#183044">Wkładka Ø4 mm</text>
<rect x="165" y="197" width="200" height="28" rx="4" fill="#2e837a"/>
<text x="375" y="217" font-family="sans-serif" font-weight="700" font-size="14" fill="#183044">179 mm</text>
<text x="49" y="265" font-family="sans-serif" font-size="14" fill="#183044">Wkładka Ø6 mm</text>
<rect x="165" y="245" width="150" height="28" rx="4" fill="#2e837a"/>
<text x="325" y="265" font-family="sans-serif" font-weight="700" font-size="14" fill="#183044">178 mm</text>
<text x="49" y="313" font-family="sans-serif" font-size="14" fill="#183044">Wkładka Ø8 mm</text>
<rect x="165" y="293" width="100" height="28" rx="4" fill="#36618c"/>
<text x="275" y="313" font-family="sans-serif" font-weight="700" font-size="14" fill="#183044">177 mm</text>
<text x="49" y="361" font-family="sans-serif" font-size="14" fill="#183044">Wkładka Ø10 mm</text>
<rect x="165" y="341" width="50" height="28" rx="4" fill="#2e837a"/>
<text x="225" y="361" font-family="sans-serif" font-weight="700" font-size="14" fill="#183044">176 mm</text>
<text x="45" y="456" font-family="sans-serif" font-size="12" fill="#8a493c">Średnice wkładek i marginesy przyjęto scenariuszowo.</text>
<rect x="550" y="96" width="472" height="383" rx="14" fill="white" stroke="#d2dae3"/>
<text x="570" y="130" font-family="sans-serif" font-weight="700" font-size="17" fill="#183044">Złożony test: 11 664 warianty</text>
<text x="570" y="153" font-family="sans-serif" font-size="12" fill="#476175">Obrys klocka + kosz modelowy + pas do wkładki</text>
<text x="571" y="198" font-family="sans-serif" font-size="14" fill="#183044">Założenie R kosza = 175 mm</text>
<rect x="570" y="210" width="320" height="25" rx="4" fill="#e4ebef"/>
<rect x="570" y="210" width="148.15" height="25" rx="4" fill="#2e837a"/>
<text x="902" y="229" font-family="sans-serif" font-weight="700" font-size="13" fill="#183044">1800</text>
<text x="571" y="283" font-family="sans-serif" font-size="14" fill="#183044">Założenie R kosza = 177,9 mm</text>
<rect x="570" y="295" width="320" height="25" rx="4" fill="#e4ebef"/>
<rect x="570" y="295" width="30.86" height="25" rx="4" fill="#2e837a"/>
<text x="902" y="314" font-family="sans-serif" font-weight="700" font-size="13" fill="#183044">375</text>
<text x="571" y="368" font-family="sans-serif" font-size="14" fill="#183044">Założenie R kosza = 180 mm</text>
<rect x="570" y="380" width="320" height="25" rx="4" fill="#e4ebef"/>
<text x="902" y="399" font-family="sans-serif" font-weight="700" font-size="13" fill="#183044">0</text>
<text x="570" y="452" font-family="sans-serif" font-size="12" fill="#8a493c">Każdy promień: 3888 scenariuszy; licznik, NIE prawdopodobieństwo.</text>
<text x="35" y="513" font-family="sans-serif" font-size="14" fill="#425768">R kosza za frontem jest nieznany — wymagany pomiar/STEP oraz testy nośności MDF i wkładek.</text>
</svg>
