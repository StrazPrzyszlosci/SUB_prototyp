<text x="42" y="448" font-family="sans-serif" font-size="12" fill="#8d4a39">Brąz: 4 żebra zastępcze. Zieleń: 8 osi hipotetycznie przesuniętych śrub.</text>
<rect x="477" y="83" width="460" height="382" rx="10" fill="#ffffff" stroke="#d6dfe7"/>
<text x="498" y="112" font-family="sans-serif" font-size="15" font-weight="bold" fill="#203344">Szerokość klocka a hipotetyczna szerokość żebra</text>
<text x="498" y="134" font-family="sans-serif" font-size="12" fill="#536475">R wewnętrzny = 178,9 mm. Maksimum przy fazie 22,5°.</text>
