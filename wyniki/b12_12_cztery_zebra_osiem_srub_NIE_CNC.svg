<text x="503" y="425" font-family="sans-serif" font-size="12" fill="#8d4a39">Warunkowo, tylko przy wzajemnym nakładaniu promieniowym i w głębokości.</text>
<text x="28" y="493" font-family="sans-serif" font-size="12" fill="#536475">Żadna z przedstawionych faz nie jest doborem montażowym. Obrót całego przetwornika nie zmienia fazy żeber względem jego otworów.</text>
