<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-label="B12-12 geometria kątowa ośmiu śrub i czterech żeber, przykład teoretyczny nie CNC">
<rect width="960" height="510" fill="#f8fafc"/>
<text x="30" y="38" font-size="22" font-family="sans-serif" font-weight="bold" fill="#203344">B12-12 — osiem śrub, cztery żebra: analiza kątowa</text>
<text x="30" y="63" font-size="12" font-family="sans-serif" fill="#536475">Żebra: schemat wg widoku producenta; ich rzeczywiste kąty/szerokości i promienie NIE zostały zmierzone.</text>
