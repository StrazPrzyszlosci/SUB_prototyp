if" font-size="13" fill="#ffb6aa">Nie pokazano mocowań, zacisków, drogi sił, rzeczywistych wręg 3D ani prób wytrzymałości</text><text x="27" y="511" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="#ffc9a2">NIE WYKONYWAĆ NA PODSTAWIE TEGO SZKICU CNC</text></svg>