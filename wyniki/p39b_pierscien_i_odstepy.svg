<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="630" viewBox="0 0 1020 630"><rect width="1020" height="630" fill="#fff"/>
<text x="36" y="43" font-family="Arial" font-weight="bold" font-size="27" fill="#1d4056">P39B • pierścień wzmacniający: czy zmieści się w skrzyni?</text>
<text x="36" y="72" font-family="Arial" font-size="15" fill="#5b7380">Przykładowy wariant: OD 400 / ID 356 / t 4 mm • jeszcze nie kwalifikowany wytrzymałościowo</text>
<g transform="translate(60 120)">
 <rect x="0" y="0" width="612" height="300" fill="#f3e9d9" stroke="#a97a45" stroke-width="3"/>
 <rect x="13.2" y="13.2" width="585.6" height="273.6" fill="none" stroke="#6996a1" stroke-width="1.4" stroke-dasharray="6 4"/>
 <circle cx="138.6" cy="150" r="120" fill="#869ba8" opacity=".75"/>
 <circle cx="138.6" cy="150" r="106.8" fill="white"/>
 <circle cx="138.6" cy="150" r="110.4" fill="none" stroke="#d38a4e" stroke-dasharray="7 4" stroke-width="2"/>
 <line x1="268.8" y1="0" x2="268.8" y2="300" stroke="#b56c4b" stroke-dasharray="7 5" stroke-width="2"/>
 <text x="304" y="70" font-family="Arial" font-size="18" fill="#34546a">Od lewego boku: 9 mm</text>
 <text x="304" y="101" font-family="Arial" font-size="18" fill="#34546a">Do pierwszej wręgi: 17 mm</text>
 <text x="304" y="132" font-family="Arial" font-size="18" fill="#34546a">Pasek metalu przy otworze: 2.75 mm</text>
 <text x="304" y="163" font-family="Arial" font-size="18" fill="#34546a">Masa stali: 0.812 kg</text>
 <text x="304" y="194" font-family="Arial" font-size="18" fill="#34546a">Zajęta objętość: 0.1034 l</text>
</g>
<text x="36" y="472" font-family="Arial" font-size="19" font-weight="bold" fill="#a15535">Ważne: pierścień nie naprawia automatycznie 2,85 mm MDF przy wycięciu.</text>
<text x="36" y="508" font-family="Arial" font-size="16" fill="#536e7e">Wewnętrzny luz między ID356 a wycięciem Ø355,8 to tylko 0,1 mm promieniowo.</text>
<text x="36" y="535" font-family="Arial" font-size="16" fill="#536e7e">Nieznany kontur kosza, tolerancje oraz obciążenia śrub mogą wymusić inną konstrukcję.</text>
<text x="36" y="587" font-family="Arial" font-size="15" fill="#a15535">Rysunek poglądowy, geometria OpenSCAD jest referencyjna. NIE frezować na tej podstawie.</text>
</svg>
