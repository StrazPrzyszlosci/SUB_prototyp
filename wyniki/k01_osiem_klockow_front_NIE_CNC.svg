<text x="849" y="271" font-family="sans-serif" font-size="14" fill="#1c3547">8 klocków: 26,1 × 36 × 30 mm</text>
<text x="849" y="297" font-family="sans-serif" font-size="14" fill="#1c3547">Promień klocków: 178,9–205 mm</text>
