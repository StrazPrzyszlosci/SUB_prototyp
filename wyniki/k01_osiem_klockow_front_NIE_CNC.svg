<text x="849" y="396" font-family="sans-serif" font-size="13" fill="#914b37">KOSZ za frontem: niezmierzony</text>
<text x="849" y="420" font-family="sans-serif" font-size="13" fill="#914b37">Śruby i wkładki: nie wybrane</text>
<text x="849" y="444" font-family="sans-serif" font-size="13" fill="#914b37">Nośność MDF i kleju: niebadana</text>
<text x="849" y="480" font-family="sans-serif" font-size="13" font-weight="bold" fill="#914b37">WARIANT DO PRÓB — NIE CNC</text>
<text x="36" y="595" font-family="sans-serif" font-size="13" fill="#567082">Rysunek autorstwa projektu, na podstawie wymiarów Dayton i zastępczych brył P39C. Nie jest fotografią gotowego prototypu.</text>
