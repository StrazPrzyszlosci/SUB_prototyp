<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" role="img" aria-label="K08 autorski schemat porównawczy śruby M6 x 85, kołnierza Dayton, frontu MDF44, klocka 20 i nakrętki. NIE CNC.">
<rect width="1180" height="470" fill="#fff"/>
<text x="38" y="41" fill="#1d3a59" font-family="DejaVu Sans,Arial" font-size="25" font-weight="bold">K08 — skąd się bierze głębokość mocowania?</text>
<text x="38" y="70" fill="#526982" font-family="DejaVu Sans,Arial" font-size="15">Autorski schemat obliczeniowy z wymiarów producenta i hipotetycznego M6 • nie rysunek producenta • NIE CNC</text>
