<text x="90" y="19" fill="#24415f" font-family="DejaVu Sans,Arial" font-size="15">Łeb ISO 4762 M6</text>
<text x="151" y="275" fill="#24415f" font-family="DejaVu Sans,Arial" font-size="16">Kołnierz 10,5</text>
<text x="290" y="275" fill="#24415f" font-family="DejaVu Sans,Arial" font-size="16">Front MDF 44</text>
<text x="708" y="275" fill="#24415f" font-family="DejaVu Sans,Arial" font-size="16">Klocek 20</text>
<text x="859" y="19" fill="#24415f" font-family="DejaVu Sans,Arial" font-size="16">Nakrętka 5</text>
<text x="535" y="323" fill="#a34b38" font-family="DejaVu Sans,Arial" font-size="18">+ podkładka 1,6 → do końca nakrętki 81,1 mm</text>
</g>
<text x="40" y="444" fill="#28425f" font-family="DejaVu Sans,Arial" font-size="17">Dla przykładowej M6×85 mm wystaje 28,9 mm za MDF44, lecz dostęp, nośność i serwis niezweryfikowane.</text>
