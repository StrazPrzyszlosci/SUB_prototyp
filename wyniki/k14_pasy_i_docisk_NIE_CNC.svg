<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="K14 porównanie niezgodnych pasów materiałów przy gwincie M5, od 0,5 mm drewna i 2,1 mm stali po 2,0 mm drewna i 0,6 mm stali. Idealizowany wskaźnik docisku rośnie wraz z grubością drewnianego pasa. Nie jest to projekt CNC.">
<rect width="1200" height="630" fill="#f4f7fa"/>
<text x="42" y="51" font-size="26" fill="#183c58" font-weight="bold" font-family="DejaVu Sans, Arial">K14 — drewno, stal i mimośrodowy docisk mocowania M5</text>
<text x="43" y="77" font-size="17" fill="#557085" font-family="DejaVu Sans, Arial">Model 20 mm klocka / płytka K13 • tylko badania przesiewowe • NIE CNC</text>
<rect x="35" y="102" width="607" height="445" rx="12" fill="white" stroke="#d5dfe7" stroke-width="2"/>
<rect x="654" y="102" width="512" height="445" rx="12" fill="white" stroke="#d5dfe7" stroke-width="2"/>
<g font-family="DejaVu Sans, Arial">
<text x="62" y="140" font-size="19" fill="#1f415b" font-weight="bold">Dwa pasy: razem tylko 2,6 mm</text>
<text x="62" y="164" font-size="14" fill="#566d7e">Od osi M5 do krawędzi klocka: 5,1 − 2,5 = 2,6 mm</text>
<rect x="62" y="179" width="20" height="13" fill="#bd8c50"/><text x="88" y="191" fill="#39566a" font-size="14">drewno</text>
<rect x="177" y="179" width="20" height="13" fill="#56738d"/><text x="202" y="191" fill="#39566a" font-size="14">stal</text>
<text x="76" y="245" fill="#233b52" font-size="16">drewno 0.5 mm</text><rect x="255" y="225" width="63.46153846153845" height="30" fill="#bd8c50"/><rect x="318.46153846153845" y="225" width="266.53846153846155" height="30" fill="#56738d"/><text x="596" y="245" fill="#254257" font-size="15" text-anchor="end">2.1 mm stali</text>
<text x="76" y="317" fill="#233b52" font-size="16">drewno 1.0 mm</text><rect x="255" y="297" width="126.9230769230769" height="30" fill="#bd8c50"/><rect x="381.9230769230769" y="297" width="203.0769230769231" height="30" fill="#56738d"/><text x="596" y="317" fill="#254257" font-size="15" text-anchor="end">1.6 mm stali</text>
<text x="76" y="389" fill="#233b52" font-size="16">drewno 1.3 mm</text><rect x="255" y="369" width="165" height="30" fill="#bd8c50"/><rect x="420" y="369" width="165" height="30" fill="#56738d"/><text x="596" y="389" fill="#254257" font-size="15" text-anchor="end">1.3 mm stali</text>
<text x="76" y="461" fill="#233b52" font-size="16">drewno 2.0 mm</text><rect x="255" y="441" width="253.8461538461538" height="30" fill="#bd8c50"/><rect x="508.8461538461538" y="441" width="76.15384615384615" height="30" fill="#56738d"/><text x="596" y="461" fill="#254257" font-size="15" text-anchor="end">0.6 mm stali</text>
<text x="62" y="516" font-size="14" fill="#8b3d37">Nie można uzyskać jednocześnie po 2 mm w obu częściach.</text>
<text x="675" y="140" font-size="19" fill="#1f415b" font-weight="bold">Nacisk: model kontaktu jednostronnego</text>
<text x="675" y="161" font-size="14" fill="#566d7e">F osiowe 1000 N — hipoteza, nie zmierzony docisk</text>
<line x1="710" y1="442.5" x2="1120" y2="442.5" stroke="#d7dfe6" stroke-dasharray="4 5"/><text x="688" y="447.5" font-size="14" text-anchor="end" fill="#5d6e7d">4 MPa</text><line x1="710" y1="347.5" x2="1120" y2="347.5" stroke="#d7dfe6" stroke-dasharray="4 5"/><text x="688" y="352.5" font-size="14" text-anchor="end" fill="#5d6e7d">5 MPa</text><line x1="710" y1="252.5" x2="1120" y2="252.5" stroke="#d7dfe6" stroke-dasharray="4 5"/><text x="688" y="257.5" font-size="14" text-anchor="end" fill="#5d6e7d">6 MPa</text>
