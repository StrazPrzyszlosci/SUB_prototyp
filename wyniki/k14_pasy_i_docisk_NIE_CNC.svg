<text x="914" y="550" text-anchor="middle" font-size="14" fill="#365267">Szerokość pasa drewna [mm]</text>
</g>
<text x="44" y="587" font-family="DejaVu Sans, Arial" font-size="15" fill="#476376">Uproszczony kontakt bez rozciągania, idealna sztywna płytka, bez otworów i MES; wartości tylko orientacyjne.</text>
<text x="44" y="613" font-family="DejaVu Sans, Arial" font-size="14" fill="#b04439" font-weight="bold">NIE JEST TO NASZ PROTOTYP ANI ZWERYFIKOWANE MOCOWANIE. CNC HOLD.</text>
</svg>
